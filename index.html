<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TASKFLOW - Gestion intelligente</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f5fa;
    color: #202b42;
}

header {
    background: #14213d;
    color: white;
    padding: 22px;
}

header h1 {
    font-size: 27px;
    letter-spacing: 1px;
}

header p {
    color: #bdc9df;
    margin-top: 7px;
    font-size: 13px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.welcome {
    margin-bottom: 22px;
}

.welcome h2 {
    font-size: 23px;
    margin-bottom: 7px;
}

.welcome p {
    color: #778196;
    font-size: 14px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 17px 12px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #00000008;
}

.card p {
    color: #778196;
    font-size: 12px;
}

.card h2 {
    margin-top: 10px;
    font-size: 25px;
    color: #2463eb;
}

.section {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px #00000008;
}

.section h3 {
    margin-bottom: 17px;
}

input, select {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    border: 1px solid #dce1eb;
    border-radius: 8px;
    font-size: 14px;
    background: white;
}

button {
    border: none;
    padding: 13px 18px;
    border-radius: 8px;
    background: #2463eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.task {
    padding: 15px;
    border: 1px solid #e4e8f0;
    border-radius: 10px;
    margin-bottom: 12px;
}

.task h4 {
    margin-bottom: 8px;
}

.task p {
    color: #778196;
    font-size: 13px;
    margin-bottom: 10px;
}

.task button {
    margin: 4px 4px 0 0;
    padding: 9px 12px;
    font-size: 12px;
}

.done {
    background: #16834a;
}

.delete {
    background: #dc3545;
}

.badge {
    font-size: 11px;
    color: #2463eb;
    background: #eaf0ff;
    padding: 5px 8px;
    border-radius: 5px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #8791a3;
    font-size: 12px;
}

@media(max-width: 500px) {
    .stats {
        gap: 7px;
    }

    .card {
        padding: 13px 8px;
    }

    .card h2 {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<header>
    <h1>TASKFLOW</h1>
    <p>Votre assistant intelligent de gestion d'entreprise</p>
</header>

<div class="container">

    <div class="welcome">
        <h2>Bienvenue sur TASKFLOW 👋</h2>
        <p>Organisez votre travail. Gagnez du temps. Atteignez vos objectifs.</p>
    </div>

    <div class="stats">
        <div class="card">
            <p>Total des tâches</p>
            <h2 id="total">0</h2>
        </div>

        <div class="card">
            <p>En cours</p>
            <h2 id="pending">0</h2>
        </div>

        <div class="card">
            <p>Terminées</p>
            <h2 id="completed">0</h2>
        </div>
    </div>

    <div class="section">
        <h3>➕ Nouvelle tâche</h3>

        <input type="text" id="taskName"
        placeholder="Nom de la tâche">

        <input type="text" id="taskDescription"
        placeholder="Description de la tâche">

        <select id="priority">
            <option value="Normale">Priorité normale</option>
            <option value="Importante">Priorité importante</option>
            <option value="Urgente">Priorité urgente</option>
        </select>

        <button onclick="addTask()">Ajouter la tâche</button>
    </div>

    <div class="section">
        <h3>📋 Mes tâches</h3>
        <div id="taskList"></div>
    </div>

</div>

<footer>
    TASKFLOW © 2026 - Simplifiez votre gestion quotidienne.
</footer>

<script>

let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask() {

    const name = document.getElementById("taskName").value.trim();
    const description = document.getElementById("taskDescription").value.trim();
    const priority = document.getElementById("priority").value;

    if (!name) {
        alert("Veuillez donner un nom à votre tâche.");
        return;
    }

    tasks.push({
        id: Date.now(),
        name: name,
        description: description,
        priority: priority,
        completed: false
    });

    saveTasks();

    document.getElementById("taskName").value = "";
    document.getElementById("taskDescription").value = "";

    renderTasks();
}

function completeTask(id) {

    tasks = tasks.map(task => {
        if (task.id === id) {
            task.completed = !task.completed;
        }
        return task;
    });

    saveTasks();
    renderTasks();
}

function deleteTask(id) {

    if (confirm("Voulez-vous vraiment supprimer cette tâche ?")) {
        tasks = tasks.filter(task => task.id !== id);
        saveTasks();
        renderTasks();
    }
}

function renderTasks() {

    const list = document.getElementById("taskList");

    list.innerHTML = "";

    tasks.forEach(task => {

        const item = document.createElement("div");
        item.className = "task";

        const title = document.createElement("h4");
        title.textContent = task.name;

        const description = document.createElement("p");
        description.textContent = task.description || "Aucune description";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = task.priority;

        const status = document.createElement("p");
        status.style.marginTop = "10px";
        status.textContent = task.completed ? "Terminée ✓" : "En cours";

        const doneButton = document.createElement("button");
        doneButton.className = "done";
        doneButton.textContent = task.completed ? "Réactiver" : "Terminer";
        doneButton.onclick = () => completeTask(task.id);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "Supprimer";
        deleteButton.onclick = () => deleteTask(task.id);

        item.appendChild(title);
        item.appendChild(description);
        item.appendChild(badge);
        item.appendChild(status);
        item.appendChild(doneButton);
        item.appendChild(deleteButton);

        list.appendChild(item);
    });

    document.getElementById("total").textContent = tasks.length;

    document.getElementById("pending").textContent =
        tasks.filter(t => !t.completed).length;

    document.getElementById("completed").textContent =
        tasks.filter(t => t.completed).length;
}

renderTasks();

</script>

</body>
</html>
